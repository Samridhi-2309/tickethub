spring:
  application:
    name: tickethub

  datasource:
    url: jdbc:postgresql://localhost:5432/tickethub
    username: tickethub
    password: tickethub
    hikari:
      maximum-pool-size: 20
      pool-name: tickethub-pool

  jpa:
    # Flyway owns the schema. Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
