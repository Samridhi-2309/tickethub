spring:
  application:
    name: tickethub

  datasource:
    url: jdbc:postgresql://localhost:5432/tickethub
    username: tickethub
    password: tickethub
    hikari:
      maximum-pool-size: 20
      pool-name: tickethub-pool

  jpa:
    # Flyway owns the schema. Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

# ── Application settings ─────────────────────────────────────
tickethub:
  # How long a seat hold survives without a confirm.
  hold-seconds: 120
  # Upper bound on seats in a single booking.
  max-seats-per-booking: 8
  # How often the orphan-seat sweeper runs.
  expiry-sweep-ms: 5000
  # How often expired idempotency records are purged.
  idem-purge-ms: 3600000
  # Which HoldStore implementation to wire in: redis (default) or memory.
  hold-store: redis
  # HS256 signing key, base64. Overridden by TICKETHUB_JWT_SECRET in any
  # real deployment — a secret in source control is not a secret.
  jwt:
    secret: ${TICKETHUB_JWT_SECRET:uOuy+gyyNTjReQhCaEXJ7mDJ96NvwiUW1qQhvKrBK79LkhSDQb/36LttXSadcdwZ}
    expiry-minutes: 60
